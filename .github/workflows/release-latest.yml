name: Mantener Latest en la app de Windows

# "Latest" debe ser SIEMPRE la versión estable más alta de la app de Windows (vX.Y.Z): de eso dependen
# /descargar, /instalar y la autoactualización (releases/latest/download/latest.json). Los Releases de
# Android (android-*) son siempre pre-release y nunca deben ser Latest.
# - Los eventos de Release corren este archivo tal como está en el commit del tag: los tags viejos (hasta
#   v2.0.1) traen la versión anterior. Por eso el cron horario (que usa master) es la red de seguridad.
# - La lógica está en .github/scripts/latest-guard.sh y se toma SIEMPRE de master (probada en workflows-lint.yml).
# Guías: docs/release.md y docs/release-android.md

on:
  release:
    types: [published, unpublished, edited, deleted, released, prereleased]
  schedule:
    - cron: "17 * * * *" # cada hora; GitHub lo pausa tras 60 días sin actividad en el repo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  latest:
    name: Latest = Windows vX.Y.Z más alta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Traer el script desde master
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'master' }} # el evento schedule no trae repository
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Revisar y corregir Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/latest-guard.sh
