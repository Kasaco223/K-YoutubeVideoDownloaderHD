name: Release

# Se dispara al subir un tag vX.Y.Z (o vX.Y.Z-rc.N para una versión de prueba).
# "Run workflow" desde una rama siempre es un ensayo: construye y prueba, pero no crea el Release.
# Desde un tag, con dry_run desmarcado, vuelve a crear (o completar) el borrador del Release.
# Guía completa: docs/release.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensayo: construir y probar la instalación sin crear el Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, prueba de instalación y Release
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Comprobar versión y tag
        id: meta
        shell: python
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          def fail(message: str) -> None:
              print(f"::error::{message}", flush=True)
              sys.exit(1)

          text = Path("src/kdownloader/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"""^__version__\s*=\s*["']([^"']+)["']""", text, re.MULTILINE)
          if not match:
              fail("No se encontró __version__ en src/kdownloader/__init__.py")
          version = match.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", version):
              fail(f"__version__ = {version!r} no tiene la forma X.Y.Z o X.Y.Z-rc.N")
          tag = f"v{version}"
          is_tag = os.environ["REF_TYPE"] == "tag"
          if is_tag and os.environ["REF_NAME"] != tag:
              fail(f"El tag {os.environ['REF_NAME']} no coincide con __version__ ({version}). "
                   "Corrige __version__ o el tag antes de publicar.")
          publish = is_tag and os.environ.get("DRY_RUN", "") != "true"
          base_url = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"
          outputs = {
              "version": version,
              "tag": tag,
              "prerelease": str("-" in version).lower(),
              "publish": str(publish).lower(),
              "base_url": base_url,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={value}\n")
          print(outputs)
          if not publish:
              print("Ensayo: se construye y se prueba, pero no se crea el Release.")

      - name: packaging/build.ps1
        shell: pwsh
        env:
          KD_VERSION: ${{ steps.meta.outputs.version }}
          KD_BASE_URL: ${{ steps.meta.outputs.base_url }}
        run: ./packaging/build.ps1 -Version $env:KD_VERSION -BaseUrl $env:KD_BASE_URL

      - name: Comprobar dist/ (latest.json y SHA256SUMS.txt)
        shell: python
        env:
          KD_VERSION: ${{ steps.meta.outputs.version }}
          KD_BASE_URL: ${{ steps.meta.outputs.base_url }}
        run: |
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version, base = os.environ["KD_VERSION"], os.environ["KD_BASE_URL"]
          dist = Path("dist")
          names = {
              "installer": "Instalar-K-Downloader.cmd",
              "bundle": f"kd-bundle-{version}.zip",
              "app": f"kd-app-{version}.zip",
          }
          problems = []

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          for name in [*names.values(), "latest.json", "SHA256SUMS.txt"]:
              if not (dist / name).is_file():
                  problems.append(f"falta dist/{name}")
          if problems:
              sys.exit("\n".join(problems))

          hashes = {name: sha256(dist / name) for name in names.values()}
          latest = json.loads((dist / "latest.json").read_text(encoding="utf-8"))
          if latest.get("version") != version:
              problems.append(f"latest.json: version = {latest.get('version')!r}, se esperaba {version!r}")
          for key, name in names.items():
              entry = latest.get(key) or {}
              if entry.get("url") != f"{base}/{name}":
                  problems.append(f"latest.json: {key}.url = {entry.get('url')!r}")
              if str(entry.get("sha256", "")).lower() != hashes[name]:
                  problems.append(f"latest.json: {key}.sha256 no coincide con dist/{name}")

          listed = {}
          for line in (dist / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              match = re.match(r"^([0-9a-fA-F]{64})\s+\*?(.+?)\s*$", line)
              if match:
                  listed[match.group(2)] = match.group(1).lower()
          for name, digest in listed.items():
              path = dist / name
              if not path.is_file():
                  problems.append(f"SHA256SUMS.txt menciona {name}, que no está en dist/")
              elif sha256(path) != digest:
                  problems.append(f"SHA256SUMS.txt: el hash de {name} no coincide")
          for name in names.values():
              if name not in listed:
                  problems.append(f"SHA256SUMS.txt no incluye {name}")

          if problems:
              print("Problemas en dist/:", *problems, sep="\n  - ")
              sys.exit(1)
          print("dist/ OK:", json.dumps(hashes, indent=2))

      - name: Prueba de instalación (smoke test)
        shell: pwsh
        env:
          KD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'kd'
          $bundle = (Resolve-Path "dist\kd-bundle-$env:KD_VERSION.zip").Path
          & ".\dist\Instalar-K-Downloader.cmd" --local $bundle --root $root --no-registry --quiet
          if ($LASTEXITCODE -ne 0) { throw "El instalador terminó con código $LASTEXITCODE" }
          foreach ($item in 'runtime\python.exe', 'launch.pyw', 'current') {
            if (-not (Test-Path (Join-Path $root $item))) { throw "La instalación no dejó $item" }
          }
          & (Join-Path $root 'runtime\python.exe') (Join-Path $root 'launch.pyw') --selftest
          if ($LASTEXITCODE -ne 0) { throw "--selftest terminó con código $LASTEXITCODE" }

      - name: Guardar dist/ como artefacto del workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Crear el Release (borrador)
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(
            "dist/Instalar-K-Downloader.cmd"
            "dist/kd-bundle-${VERSION}.zip"
            "dist/kd-app-${VERSION}.zip"
            "dist/latest.json"
            "dist/SHA256SUMS.txt"
          )
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::El Release $TAG ya está publicado. No se reemplazan archivos de un Release publicado: sube una versión nueva."
              exit 1
            fi
            echo "Ya existe un borrador de $TAG: se reemplazan sus archivos."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            args=(--draft --verify-tag --title "K-Downloader ${VERSION}" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi
          {
            echo "### Borrador listo: K-Downloader ${VERSION}"
            echo ""
            echo "Revísalo y publícalo en https://github.com/${GH_REPO}/releases (checklist en docs/release.md)."
          } >> "$GITHUB_STEP_SUMMARY"
