name: Android CI

# Corre si cambia la app de Android o algo que comparte con la de Windows (catálogo de errores, fixtures,
# engine.json). En pushes, solo master: las ramas se prueban en su PR (así no corre dos veces).
# Guía: android/README.md › Integración continua.

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/kdownloader/engine/errors_catalog.json"
      - "tests/fixtures/**"
      - "engine.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/kdownloader/engine/errors_catalog.json"
      - "tests/fixtures/**"
      - "engine.json"
      - ".github/workflows/android-ci.yml"
  schedule:
    - cron: "23 6 * * 1" # lunes: emuladores (incluido el de 16 KB) aunque no haya cambios
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # En un PR, el commit de la rama (no el merge temporal): "Acerca de" enlaza a ese código.
  KDL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # Lo mismo que instala la imagen de Docker (android/tools/docker/Dockerfile).
  SDK_PACKAGES: "platforms;android-37.0 build-tools;36.0.0"

jobs:
  build:
    name: Compilar, pruebas unitarias y lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Revisar el repositorio (scripts, SPDX, llaves, licencia, wrapper)
        run: bash android/scripts/ci_repo_checks.sh

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # La imagen del runner ya trae aceptadas las licencias del SDK; aquí no se acepta ninguna.
      - name: Paquetes del SDK fijados (no depender de lo que traiga la imagen)
        run: |
          # shellcheck disable=SC2086 # SDK_PACKAGES es una lista separada por espacios
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null > sdkmanager.log; then
            tail -n 20 sdkmanager.log
            echo "::error::sdkmanager no pudo instalar $SDK_PACKAGES (¿la imagen del runner cambió sus licencias aceptadas?)"
            exit 1
          fi

      - name: Preparar Gradle (valida el wrapper)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Pruebas, lint y APK (debug, qa minificado y pruebas instrumentadas)
        working-directory: android
        run: >-
          ./gradlew --stacktrace
          :core:test :app:testGithubDebugUnitTest :app:lintGithubDebug
          :app:assembleGithubDebug :app:assembleGithubQa :app:assembleGithubDebugAndroidTest

      - name: Páginas de 16 KB en las bibliotecas nativas (APK qa)
        run: python3 android/scripts/check_elf_alignment.py android/app/build/outputs/apk/github/qa/*.apk

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reportes-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/core/build/reports/
            android/core/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Un solo build para todo: los emuladores instalan estos APK (no vuelven a compilar).
      - name: Guardar los APK (debug para el celular; x86_64 y pruebas para los emuladores)
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/github/debug/*.apk
            android/app/build/outputs/apk/github/qa/*x86_64*.apk
            android/app/build/outputs/apk/androidTest/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: Emulador ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # El de 16 KB es informativo hasta que llegue la libwebp propia (motor con páginas de 16 KB).
    continue-on-error: ${{ matrix.informative }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "API 26 (minSdk)", api: 26, target: default, informative: false }
          - { name: "API 36 (targetSdk)", api: 36, target: google_apis, informative: false }
          - { name: "API 36 con páginas de 16 KB", api: 36, target: google_apis_ps16k, informative: true }
    steps:
      - name: Descargar los scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: android/scripts
          persist-credentials: false

      - name: Bajar los APK del build
        uses: actions/download-artifact@v8
        with:
          name: android-apk-${{ github.sha }}
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Sin caché de AVD: cada imagen ocupa 1-3 GB y se comería la caché del repo (la de Gradle).
      - name: Pruebas en el emulador (sin descargas reales de YouTube)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/scripts/ci_emulator.sh apk out

      - name: Guardar resultados y logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulador-api${{ matrix.api }}-${{ matrix.target }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
