name: Proponer una idea
description: Algo que te gustaría que K-Downloader hiciera.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por la idea. Ten en cuenta que K-Downloader no evade protecciones (DRM, contenido de pago)
        ni ayuda a saltarse bloqueos regionales: ese tipo de propuestas se cierran.

        *English is welcome too.*

  - type: textarea
    id: problem
    attributes:
      label: ¿Qué te gustaría poder hacer?
      description: Cuéntalo desde tu uso. Por ejemplo, "quiero bajar solo una parte del video".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: ¿Cómo te lo imaginas?
      description: Opcional. Dónde estaría en la app y cómo funcionaría.
    validations:
      required: false
