[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kdownloader"
dynamic = ["version"]
description = "K-Downloader: descarga tus videos favoritos en la mejor calidad, con una interfaz moderna."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kasaco223" }]
requires-python = ">=3.11"
dependencies = [
    "pywebview==6.2.1",
    "pythonnet==3.1.0",
    "comtypes>=1.4.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://kdownloader.vercel.app"
Source = "https://github.com/Kasaco223/K-YoutubeVideoDownloaderHD"

[tool.setuptools.dynamic]
version = { attr = "kdownloader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdownloader = ["ui/**/*", "engine/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: pruebas que usan internet y el motor real (yt-dlp, FFmpeg)",
    "e2e: pruebas de punta a punta con la ventana real",
]
addopts = "-m 'not network and not e2e'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]
