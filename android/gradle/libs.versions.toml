#
# Versiones verificadas el 2026-10-24 en el Maven de Google y Maven Central. Cambiar una versión = un PR
# con Android CI en verde. Aquí solo está lo que el proyecto usa hoy; cada PR agrega lo suyo.

[versions]
agp = "9.4.1"              # requiere Gradle >= 9.6 y JDK >= 17; Kotlin integrado (no aplicar kotlin-android)
kotlin = "2.4.21"          # KGP y plugins de Compose y Kotlin/JVM
composeBom = "2026.09.00"  # Compose 1.12.1 y Material 3 1.4.0 (exigen compileSdk 37)
activityCompose = "1.13.0"
appcompat = "1.8.0"        # AppCompatActivity y temas DayNight; idioma por app en API <= 32 más adelante
coreKtx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }  # lint (NewApi con el minSdk de la app) sobre :core
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# NO org.jetbrains.kotlin.android: AGP 9 trae Kotlin integrado y falla si se aplica.
